<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 宣纸底色微渐变 -->
    <radialGradient id="paperGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FCFAF5"/>
      <stop offset="70%" stop-color="#F5EFE1"/>
      <stop offset="100%" stop-color="#EBE3D0"/>
    </radialGradient>

    <!-- 朱砂印泥渐变 -->
    <linearGradient id="sealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A63333"/>
      <stop offset="60%" stop-color="#8A2B2B"/>
      <stop offset="100%" stop-color="#6E1B1B"/>
    </linearGradient>

    <!-- 远山水墨渐变 -->
    <linearGradient id="inkMountainBack" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#9AA69E" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#D9DDD7" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="inkMountainMid" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#4F5D56" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8A9790" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="inkMountainFront" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#24302A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#4F5D56" stop-opacity="0.4"/>
    </linearGradient>

    <!-- 金辉曜月渐变 -->
    <radialGradient id="sunMoonGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FBE7A1"/>
      <stop offset="65%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9E781E"/>
    </radialGradient>

    <!-- 阴影微晕 -->
    <filter id="sealShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#5A1A1A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 1. 雅正外形：平滑圆角宣纸底板 -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#paperGrad)" />

  <!-- 2. 两宋官作双道回纹描金边框 -->
  <rect x="32" y="32" width="448" height="448" rx="92" fill="none" stroke="#C5A059" stroke-width="3.5" stroke-opacity="0.85" />
  <rect x="42" y="42" width="428" height="428" rx="82" fill="none" stroke="#C5A059" stroke-width="1.2" stroke-dasharray="8,6" stroke-opacity="0.5" />

  <!-- 四角如意云纹点缀 -->
  <path d="M 60 76 Q 76 76 76 60" fill="none" stroke="#C5A059" stroke-width="2.5" />
  <path d="M 452 76 Q 436 76 436 60" fill="none" stroke="#C5A059" stroke-width="2.5" />
  <path d="M 60 436 Q 76 436 76 452" fill="none" stroke="#C5A059" stroke-width="2.5" />
  <path d="M 452 436 Q 436 436 436 452" fill="none" stroke="#C5A059" stroke-width="2.5" />

  <!-- 3. 天象：晓日金乌 / 碧空明月 -->
  <circle cx="346" cy="156" r="46" fill="url(#sunMoonGrad)" opacity="0.9" />
  <circle cx="346" cy="156" r="54" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.4" />

  <!-- 4. 云山远岫水墨层叠 -->
  <!-- 远山 -->
  <path d="M 52 350 Q 140 210 230 280 T 400 220 Q 440 240 460 350 Z" fill="url(#inkMountainBack)" />
  <!-- 中景山峰 -->
  <path d="M 46 365 Q 110 250 186 295 T 330 245 Q 400 270 466 365 Z" fill="url(#inkMountainMid)" />
  <!-- 近景云山峻岭 -->
  <path d="M 40 380 Q 95 285 160 320 Q 235 270 295 330 Q 365 295 472 380 Z" fill="url(#inkMountainFront)" />

  <!-- 5. 溪山烟岚水波微澜 -->
  <path d="M 72 388 Q 160 376 256 388 T 440 388" fill="none" stroke="#8A9790" stroke-width="2" opacity="0.4" />
  <path d="M 96 400 Q 180 392 270 400 T 416 400" fill="none" stroke="#8A9790" stroke-width="1.5" stroke-dasharray="12,8" opacity="0.3" />

  <!-- 6. 居中核心朱批大印：两宋崇雅金石印章 -->
  <g transform="translate(186, 260)" filter="url(#sealShadow)">
    <!-- 印泥方台 -->
    <rect x="0" y="0" width="140" height="140" rx="20" fill="url(#sealGrad)" />
    <!-- 篆刻双边线 -->
    <rect x="8" y="8" width="124" height="124" rx="14" fill="none" stroke="#FBE7A1" stroke-width="2.5" stroke-opacity="0.85" />
    <rect x="13" y="13" width="114" height="114" rx="10" fill="none" stroke="#FBE7A1" stroke-width="0.9" stroke-opacity="0.45" />

    <!-- 篆体朱文金字：「华风」九叠小篆风骨 -->
    <!-- 左侧「风」九叠篆文意象 -->
    <path d="M 36 32 L 60 32 Q 66 32 66 38 L 66 102 Q 66 108 60 108 L 36 108" fill="none" stroke="#FAF7F0" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 44 48 L 58 48 Q 58 64 44 64 L 58 64 Q 58 84 44 92" fill="none" stroke="#FAF7F0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 右侧「华」九叠篆文意象 -->
    <path d="M 80 34 L 104 34 M 92 28 L 92 112" fill="none" stroke="#FAF7F0" stroke-width="4" stroke-linecap="round"/>
    <path d="M 76 52 L 108 52 M 76 70 L 108 70 M 76 88 L 108 88" fill="none" stroke="#FAF7F0" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="92" cy="70" r="14" fill="none" stroke="#FAF7F0" stroke-width="2.5"/>
  </g>

  <!-- 7. 飞鸟数点破长空 -->
  <path d="M 120 160 Q 128 152 136 160 Q 144 152 152 160" fill="none" stroke="#4F5D56" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M 154 142 Q 160 136 166 142 Q 172 136 178 142" fill="none" stroke="#4F5D56" stroke-width="2" stroke-linecap="round"/>
</svg>
