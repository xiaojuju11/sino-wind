<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>迎请故友 · 自定知己</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'rice-paper': '#F7F4EB',
            'silk-white': '#FAF7F0',
            'rice-deep': '#EFEBE1',
            'ink-deep': '#2B2B2B',
            'ink-gray': '#6B675B',
            'cinnabar': '#8A2B2B',
            'bamboo': '#2D5A3F',
            'mud-gold': '#C59B27',
          },
          fontFamily: {
            serif: ['"Noto Serif SC"', 'SimSun', 'Songti SC', 'serif'],
            sans: ['-apple-system', 'BlinkMacSystemFont', '"PingFang SC"', '"Helvetica Neue"', 'sans-serif'],
          },
          boxShadow: {
            'reverie': '0 4px 16px rgba(0, 0, 0, 0.04)',
            'drawer': '0 -8px 30px rgba(0, 0, 0, 0.12)',
          }
        }
      }
    }
  </script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #2B2B2B;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .custom-scroll::-webkit-scrollbar {
      display: none;
    }
    .custom-scroll {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .paper-texture {
      background-color: #F7F4EB;
      background-image: radial-gradient(rgba(138, 43, 43, 0.03) 1px, transparent 0);
      background-size: 24px 24px;
    }
  </style>
</head>
<body class="w-[390px] h-[844px] max-w-[390px] max-h-[844px] mx-auto overflow-hidden relative select-none">

  <!-- Underlying Layer: Previous Screen Context (知己信札) With Warm Ink Scrim -->
  <div class="absolute inset-0 paper-texture opacity-90 filter blur-[1.5px] pointer-events-none">
    <!-- Header simulation -->
    <div class="px-4 pt-12 pb-3 flex items-center justify-between border-b border-[rgba(138,43,43,0.12)] bg-[#FAF7F0]/80">
      <div class="flex items-center space-x-2">
        <span class="font-serif text-lg font-bold text-ink-deep">知己信札</span>
        <span class="text-[10px] px-1.5 py-0.5 border border-cinnabar/40 text-cinnabar rounded">尺素</span>
      </div>
    </div>
    <!-- Simulated Contacts strip -->
    <div class="px-4 py-3 flex space-x-3 opacity-60">
      <div class="w-12 h-12 rounded-full border border-cinnabar bg-[#EFEBE1]"></div>
      <div class="w-12 h-12 rounded-full border border-black/10 bg-[#EFEBE1]"></div>
      <div class="w-12 h-12 rounded-full border border-black/10 bg-[#EFEBE1]"></div>
      <div class="w-12 h-12 rounded-full border border-black/10 bg-[#EFEBE1]"></div>
    </div>
    <!-- Simulated list cards -->
    <div class="px-4 space-y-3 mt-2 opacity-40">
      <div class="h-16 rounded-xl bg-white/70"></div>
      <div class="h-16 rounded-xl bg-white/70"></div>
      <div class="h-16 rounded-xl bg-white/70"></div>
    </div>
  </div>

  <!-- Warm Ink Scrim Overlay rgba(43,43,43,0.45) -->
  <div class="absolute inset-0 bg-[#2B2B2B]/45 transition-opacity duration-300"></div>

  <!-- Bottom Drawer Component (占据屏幕下方约 78% 高度: 658px) -->
  <div class="absolute bottom-0 left-0 right-0 h-[660px] bg-silk-white rounded-t-[16px] shadow-drawer border-t border-[rgba(138,43,43,0.15)] flex flex-col z-20 overflow-hidden">
    
    <!-- Drag Handle Indicator -->
    <div class="pt-2 pb-1 flex justify-center items-center">
      <div class="w-10 h-1 rounded-full bg-[#D8D2C4]"></div>
    </div>

    <!-- Drawer Top Bar -->
    <div class="px-4 py-2.5 flex items-center justify-between border-b border-[rgba(138,43,43,0.1)]">
      <button class="flex items-center space-x-1 text-ink-gray active:opacity-70 transition-opacity">
        <!-- Linear Close/Leave Icon -->
        <svg class="w-4 h-4 text-ink-gray" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
        <span class="text-xs font-serif">离席</span>
      </button>

      <!-- Center Title -->
      <h2 class="font-serif text-[17px] font-semibold text-ink-deep tracking-wider flex items-center space-x-1.5">
        <span>迎请故友 · 自定知己</span>
        <span class="inline-block w-1.5 h-1.5 rounded-full bg-mud-gold"></span>
      </h2>

      <!-- Right Balance Placeholder -->
      <div class="w-8"></div>
    </div>

    <!-- Scrollable Drawer Body with strict 20px spacing sections -->
    <div class="flex-1 overflow-y-auto custom-scroll px-4 pt-3.5 pb-28 space-y-5">
      
      <!-- Section 1: 基础表单 (诗人名号 & 所属朝代) -->
      <div class="space-y-3">
        <!-- Row 1: 诗人名号 -->
        <div>
          <label class="block text-xs font-serif text-ink-gray mb-1.5 font-medium">诗人名号</label>
          <div class="w-full h-11 px-3.5 bg-rice-deep rounded-[12px] flex items-center shadow-inner">
            <input 
              type="text" 
              value="辛弃疾" 
              placeholder="输入姓名，如：辛弃疾 / 纳兰性德 / 陶渊明"
              class="w-full bg-transparent text-sm text-ink-deep placeholder:text-ink-gray/60 focus:outline-none font-sans font-medium"
            />
          </div>
        </div>

        <!-- Row 2: 所属朝代 -->
        <div>
          <label class="block text-xs font-serif text-ink-gray mb-1.5 font-medium">所属朝代</label>
          <div class="w-full h-11 px-3.5 bg-rice-deep rounded-[12px] flex items-center justify-between cursor-pointer">
            <div class="flex items-center space-x-2">
              <span class="text-sm font-serif font-bold text-ink-deep">宋</span>
              <span class="text-xs text-ink-gray/70">（南宋 · 历任江西安抚使）</span>
            </div>
            <!-- Linear Chevron Down -->
            <div class="flex items-center space-x-1 text-ink-gray">
              <span class="text-xs text-ink-gray/80">唐 / 宋 / 明 / 清 / 自定义</span>
              <svg class="w-4 h-4 text-ink-gray" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </div>
          </div>
        </div>
      </div>

      <!-- Section 2: AI 一键考释赋魂按钮卡片 (1px 泥金描边与徽章) -->
      <div class="p-3.5 rounded-[12px] bg-silk-white border border-mud-gold shadow-reverie relative overflow-hidden group">
        <!-- Corner watermark flourish -->
        <div class="absolute -right-3 -top-3 w-12 h-12 rounded-full bg-mud-gold/10 pointer-events-none"></div>
        <div class="flex items-start space-x-3">
          <!-- Linear Sparkle / Starburst Icon in Mud Gold -->
          <div class="w-8 h-8 rounded-lg bg-mud-gold/10 border border-mud-gold/30 flex items-center justify-center shrink-0 text-mud-gold">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2l2.4 6.6L21 11l-5.6 4.4L17 22l-5-4-5 4 1.6-6.6L3 11l6.6-2.4L12 2z"></path>
            </svg>
          </div>
          <div class="flex-1">
            <div class="flex items-center space-x-2 mb-0.5">
              <h3 class="font-serif text-[15px] font-bold text-ink-deep tracking-wide">AI 一键考释赋魂</h3>
              <span class="text-[10px] px-1.5 py-0.5 rounded bg-mud-gold/15 text-mud-gold font-serif font-medium border border-mud-gold/30">考据经纬</span>
            </div>
            <p class="text-xs text-ink-gray leading-relaxed font-sans">
              只需输入诗人名，AI 自动搜集生平、存诗量与朋友圈！
            </p>
          </div>
        </div>
      </div>

      <!-- Section 3: 生涯纪略 (AI 自动填充，用户可编辑) -->
      <div class="space-y-1.5">
        <div class="flex items-center justify-between">
          <label class="text-xs font-serif text-ink-gray font-medium">生涯纪略</label>
          <span class="text-[11px] text-ink-gray/75">AI 自动填充，用户可编辑</span>
        </div>
        <div class="p-3 bg-silk-white rounded-[12px] border border-[rgba(138,43,43,0.12)] shadow-reverie">
          <p class="text-sm text-ink-deep leading-[1.65] font-sans">
            字幼安，号稼轩，南宋豪放派词人。存词六百余首，文武双全，金戈铁马，报国之志终身不渝。
          </p>
          <div class="mt-2 pt-2 border-t border-[rgba(138,43,43,0.08)] flex justify-between items-center text-[11px] text-ink-gray">
            <span>收录《稼轩长短句》</span>
            <span class="flex items-center space-x-1 text-ink-gray/70">
              <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
              </svg>
              <span>可点击修改</span>
            </span>
          </div>
        </div>
      </div>

      <!-- Section 4: 知己朋友圈 -->
      <div class="space-y-1.5">
        <label class="text-xs font-serif text-ink-gray font-medium">知己朋友圈</label>
        <div class="p-3 bg-silk-white rounded-[12px] border border-[rgba(138,43,43,0.12)] shadow-reverie flex items-center justify-between">
          <div class="flex items-center flex-wrap gap-y-1 text-sm font-sans text-ink-deep">
            <span class="text-ink-gray font-serif text-xs mr-2 shrink-0">挚友：</span>
            <span class="font-medium">陈亮<span class="text-xs text-ink-gray font-normal">（鹅湖同盟）</span></span>
            <span class="mx-1.5 text-mud-gold font-bold">·</span>
            <span class="font-medium">朱熹</span>
            <span class="mx-1.5 text-mud-gold font-bold">·</span>
            <span class="font-medium">刘过</span>
          </div>
          <!-- Linear Network Badge -->
          <div class="shrink-0 text-ink-gray ml-2">
            <svg class="w-4 h-4 text-ink-gray/60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="18" cy="5" r="3"></circle>
              <circle cx="6" cy="12" r="3"></circle>
              <circle cx="18" cy="19" r="3"></circle>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
              <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
            </svg>
          </div>
        </div>
      </div>

      <!-- Section 5: 文风性格标签 (竹青雅色选中态) -->
      <div class="space-y-1.5">
        <label class="text-xs font-serif text-ink-gray font-medium">文风性格标签</label>
        <div class="flex items-center flex-wrap gap-2">
          <!-- Tag 1: Selected (竹青雅色实心底加象牙白字) -->
          <div class="px-3 py-1.5 rounded-full bg-bamboo text-silk-white text-xs font-serif font-medium shadow-sm flex items-center space-x-1 cursor-pointer">
            <span>豪迈悲壮</span>
            <svg class="w-3 h-3 text-silk-white/90" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>

          <!-- Tag 2: Unselected -->
          <div class="px-3 py-1.5 rounded-full bg-rice-deep border border-[rgba(138,43,43,0.12)] text-ink-deep text-xs font-serif cursor-pointer hover:border-bamboo transition-colors">
            <span>气吞万里</span>
          </div>

          <!-- Tag 3: Unselected -->
          <div class="px-3 py-1.5 rounded-full bg-rice-deep border border-[rgba(138,43,43,0.12)] text-ink-deep text-xs font-serif cursor-pointer hover:border-bamboo transition-colors">
            <span>沉郁雄奇</span>
          </div>

          <!-- Tag 4: Unselected -->
          <div class="px-3 py-1.5 rounded-full bg-rice-deep border border-[rgba(138,43,43,0.12)] text-ink-deep text-xs font-serif cursor-pointer hover:border-bamboo transition-colors">
            <span>醉里挑灯</span>
          </div>
        </div>
      </div>

    </div>

    <!-- Fixed Bottom Sticky Area with Cinnabar Confirmation Button -->
    <div class="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-silk-white via-silk-white/95 to-silk-white/40 border-t border-[rgba(138,43,43,0.08)] z-30">
      <button class="w-full h-12 bg-cinnabar hover:bg-cinnabar/95 active:scale-[0.99] text-[#FAF7F0] font-serif text-[17px] font-semibold tracking-wider rounded-[12px] shadow-reverie flex items-center justify-center space-x-2 transition-all">
        <!-- Linear Seal / Scroll Stamp Icon -->
        <svg class="w-5 h-5 text-[#FAF7F0]/90" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
        </svg>
        <span>结为知己 · 迎入先贤席</span>
      </button>
      <!-- iOS Safe Bottom Padding -->
      <div class="h-3"></div>
    </div>

  </div>

</body>
</html>
